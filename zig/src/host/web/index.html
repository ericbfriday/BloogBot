<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloogBot Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; min-height: 100vh;
  }
  aside {
    width: 260px; background: #161b22; padding: 20px;
    border-right: 1px solid #30363d;
  }
  aside h1 { font-size: 18px; color: #58a6ff; margin-bottom: 20px; }
  aside nav a {
    display: block; padding: 8px 12px; margin: 2px 0;
    color: #8b949e; text-decoration: none; border-radius: 6px;
    font-size: 14px;
  }
  aside nav a:hover, aside nav a.active {
    background: #1f6feb22; color: #58a6ff;
  }
  main { flex: 1; padding: 24px; overflow-y: auto; }
  h2 { font-size: 22px; margin-bottom: 16px; color: #e6edf3; }

  .card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  .card h3 { font-size: 14px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

  .status-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .stat {
    background: #0d1117; border-radius: 6px; padding: 12px 16px;
  }
  .stat .label { font-size: 12px; color: #8b949e; }
  .stat .value { font-size: 20px; font-weight: 600; color: #e6edf3; margin-top: 4px; }
  .stat .value.running { color: #3fb950; }
  .stat .value.stopped { color: #f85149; }

  .log-container {
    background: #0d1117; border-radius: 6px; padding: 12px;
    font-family: "Cascadia Code", "Fira Code", monospace; font-size: 12px;
    max-height: 300px; overflow-y: auto;
  }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #21262d; }
  .log-entry .ts { color: #484f58; }
  .log-entry .level-info { color: #58a6ff; }
  .log-entry .level-warn { color: #d29922; }
  .log-entry .level-error { color: #f85149; }

  .settings-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 24px; font-size: 13px;
  }
  .settings-grid .key { color: #8b949e; }
  .settings-grid .val { color: #e6edf3; }

  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .toolbar button {
    padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px;
  }
  .toolbar button:hover { background: #30363d; }
  .toolbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .toolbar button.primary:hover { background: #388bfd; }
  .toolbar button.danger { background: #da3633; border-color: #da3633; color: #fff; }

  #page-settings, #page-logs { display: none; }
</style>
</head>
<body>
<aside>
  <h1>BloogBot</h1>
  <nav>
    <a href="#" class="active" onclick="showPage('status')">Dashboard</a>
    <a href="#" onclick="showPage('settings')">Settings</a>
    <a href="#" onclick="showPage('logs')">Log</a>
  </nav>
</aside>
<main>
  <!-- Status / Dashboard page -->
  <div id="page-status">
    <h2>Dashboard</h2>
    <div class="toolbar">
      <button class="primary" onclick="fetch('/api/status').then(()=>console.log('refreshed'))">Refresh</button>
    </div>
    <div class="card">
      <h3>Bot Status</h3>
      <div class="status-grid" id="status-grid">
        <div class="stat"><div class="label">State</div><div class="value" id="s-state">---</div></div>
        <div class="stat"><div class="label">Running</div><div class="value" id="s-running">---</div></div>
        <div class="stat"><div class="label">Tick</div><div class="value" id="s-tick">---</div></div>
        <div class="stat"><div class="label">Hotspot</div><div class="value" id="s-hotspot">---</div></div>
        <div class="stat"><div class="label">Units</div><div class="value" id="s-units">---</div></div>
        <div class="stat"><div class="label">Players</div><div class="value" id="s-players">---</div></div>
      </div>
    </div>
  </div>

  <!-- Settings page -->
  <div id="page-settings">
    <h2>Settings</h2>
    <div class="card">
      <h3>Current Configuration</h3>
      <div class="settings-grid" id="settings-grid">Loading...</div>
    </div>
  </div>

  <!-- Log page -->
  <div id="page-logs">
    <h2>Event Log</h2>
    <div class="card">
      <div class="log-container" id="log-container">
        <div class="log-entry"><span class="ts">--:--:--</span> <span class="level-info">[info]</span> WebSocket connecting...</div>
      </div>
    </div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
